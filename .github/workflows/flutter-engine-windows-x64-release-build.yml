name: Build Flutter Engine

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Self-hosted runner labels for the Windows engine build.
        required: true
        default: '["self-hosted","Windows","X64"]'
      vs_installation_path:
        description: Visual Studio installation path on the runner.
        required: true
        default: C:\Program Files (x86)\Microsoft Visual Studio\2019\Community

permissions:
  contents: write

jobs:
  build-engine:
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Checkout Flutter
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Depot Tools
        uses: newkdev/setup-depot-tools@v1.0.1

      - name: Set environment variables
        run: |
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          echo "GYP_MSVS_OVERRIDE_PATH=${{ inputs.vs_installation_path }}" >> $env:GITHUB_ENV
          echo "WINDOWSSDKDIR=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV

      - name: Sync engine dependencies
        run: |
          Copy-Item -Path "engine\scripts\standard.gclient" -Destination ".gclient" -Force
          gclient sync -D
          $dartRevision = (Select-String -Path "DEPS" -Pattern "'dart_revision': '([^']+)'").Matches[0].Groups[1].Value
          $currentDartRevision = git -C "engine\src\flutter\third_party\dart" rev-parse HEAD
          Write-Host "Expected Dart SDK revision: $dartRevision"
          Write-Host "Current Dart SDK revision: $currentDartRevision"
          if ($currentDartRevision -ne $dartRevision) {
            git -C "engine\src\flutter\third_party\dart" fetch origin $dartRevision
            if ($LASTEXITCODE -ne 0) {
              git -C "engine\src\flutter\third_party\dart" fetch origin main
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch Dart SDK revision $dartRevision"
            }
            git -C "engine\src\flutter\third_party\dart" checkout --detach $dartRevision
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout Dart SDK revision $dartRevision"
            }
          }
          git -C "engine\src\flutter\third_party\dart" rev-parse HEAD

      - name: Apply Windows 7 Dart patches
        run: |
          powershell -ExecutionPolicy Bypass -File "engine\scripts\apply_windows7_dart_patches.ps1"

      - name: Build Flutter engine
        working-directory: engine/src
        run: |
          python .\flutter\tools\gn --runtime-mode=release --no-prebuilt-dart-sdk
          ninja -C .\out\host_release

      - name: Verify Windows 7 compatible imports
        working-directory: engine/src
        run: |
          $readobj = ".\flutter\buildtools\windows-x64\clang\bin\llvm-readobj.exe"
          if (-not (Test-Path -LiteralPath $readobj)) {
            $readobj = "llvm-readobj"
          }

          $binaries = @(
            ".\out\host_release\flutter_windows.dll",
            ".\out\host_release\gen_snapshot.exe"
          )
          $blockedImports = @(
            "GetCurrentThreadStackLimits"
          )

          $failed = $false
          foreach ($binary in $binaries) {
            if (-not (Test-Path -LiteralPath $binary)) {
              throw "Build output not found: $binary"
            }

            $imports = & $readobj --coff-imports $binary 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host $imports
              throw "Failed to read imports for $binary"
            }

            foreach ($blockedImport in $blockedImports) {
              if ($imports -match "Symbol:\s+$([regex]::Escape($blockedImport))\b") {
                Write-Error "$binary imports $blockedImport, which is not available on Windows 7."
                $failed = $true
              }
            }
          }

          if ($failed) {
            throw "Windows 7 incompatible imports were found."
          }

      - name: Package build outputs
        working-directory: engine/src
        run: |
          $outputPath = "${{ github.workspace }}\windows-x64-release.zip"
          $artifactNames = @(
            "flutter_windows.dll",
            "flutter_windows.dll.pdb",
            "flutter_windows.dll.exp",
            "flutter_windows.dll.lib",
            "flutter_windows.h",
            "flutter_export.h",
            "flutter_messenger.h",
            "flutter_plugin_registrar.h",
            "flutter_texture_registrar.h",
            "license.windows_flutter.md",
            "gen_snapshot.exe"
          )
          $filesToCompress = Get-ChildItem -Path ".\out\host_release" |
              Where-Object { $_.Name -in $artifactNames }
          $filesToCompressPaths = $filesToCompress.FullName
          if ($filesToCompressPaths) {
            Compress-Archive -Path $filesToCompressPaths -DestinationPath $outputPath -Force
          } else {
            Write-Error "Build output files not found!"
          }

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: windows-x64-release.zip
          tag: ${{ github.ref_name }}
          overwrite: true
          body: Flutter Engine Release
