name: Build Flutter Engine

on:
  workflow_dispatch:
    inputs:
      vs_installation_path:
        description: Visual Studio 2019 Build Tools installation path on the runner.
        required: true
        default: C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools

permissions:
  contents: write

jobs:
  build-engine:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Flutter
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Configure Git
        run: |
          git config --global core.longpaths true
          git config --global --get core.longpaths

      - name: Install Visual Studio 2019 Build Tools
        run: |
          $vsPath = "${{ inputs.vs_installation_path }}"

          function Test-VS2019V142 {
            if (-not (Test-Path -LiteralPath $vsPath)) {
              return $false
            }

            $vcToolsPath = Join-Path $vsPath "VC\Tools\MSVC"
            $v142Tools = Get-ChildItem -Path $vcToolsPath -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like "14.2*" } |
                Select-Object -First 1
            if ($v142Tools) {
              Write-Host "Found VS2019 v142 toolchain at $($v142Tools.FullName)"
              $atlLib = Join-Path $v142Tools.FullName "atlmfc\lib\x64\atls.lib"
              if (Test-Path -LiteralPath $atlLib) {
                Write-Host "Found VS2019 ATL library at $atlLib"
                return $true
              }
              Write-Host "VS2019 ATL library not found at $atlLib"
            }

            return $false
          }

          if (Test-VS2019V142) {
            exit 0
          }

          $installer = Join-Path $env:RUNNER_TEMP "vs_buildtools_2019.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vs_buildtools.exe" -OutFile $installer
          $installArgs = @(
            "--quiet",
            "--wait",
            "--norestart",
            "--nocache",
            "--installPath", "`"$vsPath`"",
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.v142.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru -WindowStyle Hidden

          $installExitCode = $process.ExitCode
          Write-Host "Visual Studio 2019 Build Tools installer exit code: $installExitCode"
          if ($null -eq $installExitCode) {
            throw "Visual Studio 2019 Build Tools installer did not report an exit code."
          }
          if ($installExitCode -ne 0 -and $installExitCode -ne 3010) {
            throw "Visual Studio 2019 Build Tools install failed with exit code $installExitCode"
          }
          if ($installExitCode -eq 3010) {
            Write-Host "Visual Studio 2019 Build Tools install completed with reboot-required exit code 3010."
          }
          if (-not (Test-VS2019V142)) {
            throw "VS2019 v142 toolchain or ATL libraries not found after install: $vsPath"
          }
          exit 0

      - name: Install Depot Tools
        run: |
          $depotTools = Join-Path $env:RUNNER_TEMP "depot_tools"
          if (Test-Path -LiteralPath $depotTools) {
            Remove-Item -LiteralPath $depotTools -Recurse -Force
          }
          New-Item -Path $depotTools -ItemType Directory -Force | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "depot_tools.zip"
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-infra/depot_tools.zip" -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $depotTools -Force
          $depotTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DEPOT_TOOLS=$depotTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set environment variables
        run: |
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2019" >> $env:GITHUB_ENV
          echo "GYP_MSVS_OVERRIDE_PATH=${{ inputs.vs_installation_path }}" >> $env:GITHUB_ENV
          echo "WINDOWSSDKDIR=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV
          echo "ENGINE_WINDOWS_SDK_VERSION=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Verify Visual Studio 2019 toolchain
        run: |
          $vsPath = "${{ inputs.vs_installation_path }}"
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path -LiteralPath $vcvars)) {
            throw "vcvarsall.bat not found: $vcvars"
          }

          cmd /c "`"$vcvars`" amd64 10.0.19041.0 && where cl && cl"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify Visual Studio 2019 toolchain"
          }

      - name: Sync engine dependencies
        run: |
          Copy-Item -Path "engine\scripts\standard.gclient" -Destination ".gclient" -Force
          gclient sync -D
          $dartRevision = (Select-String -Path "DEPS" -Pattern "'dart_revision': '([^']+)'").Matches[0].Groups[1].Value
          $currentDartRevision = git -C "engine\src\flutter\third_party\dart" rev-parse HEAD
          Write-Host "Expected Dart SDK revision: $dartRevision"
          Write-Host "Current Dart SDK revision: $currentDartRevision"
          if ($currentDartRevision -ne $dartRevision) {
            git -C "engine\src\flutter\third_party\dart" fetch origin $dartRevision
            if ($LASTEXITCODE -ne 0) {
              git -C "engine\src\flutter\third_party\dart" fetch origin main
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch Dart SDK revision $dartRevision"
            }
            git -C "engine\src\flutter\third_party\dart" checkout --detach $dartRevision
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout Dart SDK revision $dartRevision"
            }
          }
          git -C "engine\src\flutter\third_party\dart" rev-parse HEAD

      - name: Apply Windows 7 Dart patches
        run: |
          powershell -ExecutionPolicy Bypass -File "engine\scripts\apply_windows7_dart_patches.ps1"

      - name: Apply Windows 7 atomic wait shim
        run: |
          powershell -ExecutionPolicy Bypass -File "engine\scripts\apply_windows7_atomic_wait_shim.ps1"

      - name: Build Flutter engine
        working-directory: engine/src
        run: |
          python .\flutter\tools\gn --runtime-mode=release --no-prebuilt-dart-sdk
          ninja -C .\out\host_release windows gen_snapshot flutter/build/archives:windows_flutter

      - name: Verify Windows 7 compatible imports
        working-directory: engine/src
        run: |
          $readobj = ".\flutter\buildtools\windows-x64\clang\bin\llvm-readobj.exe"
          if (-not (Test-Path -LiteralPath $readobj)) {
            $readobj = "llvm-readobj"
          }

          function Test-IsRuntimeDll {
            param([string]$Name)

            return $Name -like "api-ms-win-*.dll" -or
                $Name -ieq "ucrtbase.dll" -or
                $Name -ieq "ucrtbased.dll" -or
                $Name -like "vcruntime*.dll" -or
                $Name -like "msvcp*.dll" -or
                $Name -like "concrt*.dll"
          }

          function Write-DllInventory {
            param(
              [string]$Title,
              [System.IO.FileInfo[]]$Files
            )

            Write-Host ""
            Write-Host $Title
            if ($Files.Count -eq 0) {
              Write-Host "  (none)"
              return
            }

            foreach ($file in ($Files | Sort-Object FullName)) {
              $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file.FullName)
              "{0,-45} {1,12} {2}" -f $file.Name, $file.Length, $versionInfo.FileVersion
            }
          }

          $outputDir = ".\out\host_release"
          if (-not (Test-Path -LiteralPath $outputDir)) {
            throw "Build output directory not found: $outputDir"
          }

          $archive = ".\out\host_release\zip_archives\windows-x64-release\windows-x64-flutter.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Build archive not found: $archive"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "windows-x64-flutter-verify"
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          New-Item -Path $verifyDir -ItemType Directory -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyDir -Force

          $outputRuntimeDlls = @(Get-ChildItem -LiteralPath $outputDir -File |
              Where-Object { Test-IsRuntimeDll $_.Name } |
              Sort-Object FullName)
          Write-DllInventory "Runtime DLLs present in out/host_release (build output, not necessarily packaged):" $outputRuntimeDlls

          $packageDlls = @(Get-ChildItem -LiteralPath $verifyDir -Recurse -File |
              Where-Object { $_.Extension -eq ".dll" } |
              Sort-Object FullName)
          Write-DllInventory "DLLs present in windows-x64-flutter.zip:" $packageDlls

          $binaries = @(Get-ChildItem -LiteralPath $verifyDir -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              Sort-Object FullName)
          if ($binaries.Count -eq 0) {
            throw "No exe/dll outputs found in extracted archive: $archive"
          }

          $requiredBinaries = @(
            (Join-Path $verifyDir "flutter_windows.dll"),
            (Join-Path $verifyDir "gen_snapshot.exe")
          )
          foreach ($requiredBinary in $requiredBinaries) {
            if (-not (Test-Path -LiteralPath $requiredBinary)) {
              throw "Required archive binary not found: $requiredBinary"
            }
          }

          $blockedImports = @(
            "GetCurrentThreadStackLimits",
            "WaitOnAddress",
            "WakeByAddressSingle",
            "WakeByAddressAll"
          )
          $blockedDlls = @(
            "api-ms-win-core-synch-l1-2-0.dll"
          )

          $failed = $false
          $archiveFileNames = @{}
          foreach ($binary in $binaries) {
            $archiveFileNames[$binary.Name.ToLowerInvariant()] = $true
          }

          foreach ($binary in $binaries) {
            $binaryPath = $binary.FullName
            $isRuntimeDll = Test-IsRuntimeDll $binary.Name

            $imports = & $readobj --coff-imports $binaryPath 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host $imports
              throw "Failed to read imports for $binaryPath"
            }

            foreach ($blockedDll in $blockedDlls) {
              if ($imports -match "Name:\s+$([regex]::Escape($blockedDll))\b") {
                if ($isRuntimeDll) {
                  Write-Warning "$binaryPath imports $blockedDll as part of the VC++/UCRT runtime set."
                  if (-not $archiveFileNames.ContainsKey($blockedDll.ToLowerInvariant())) {
                    Write-Host "::error::$binaryPath imports $blockedDll, but that API-set DLL is not present in the archive. Do not deploy only ucrtbase.dll; deploy a complete matching VC++/UCRT runtime set or install the redist on Windows 7."
                    $failed = $true
                  }
                } else {
                  Write-Host "::error::$binaryPath imports $blockedDll directly. That indicates engine/application code is still linked to a Windows 8+ API-set instead of using the Win7 shim."
                  $failed = $true
                }
              }
            }
            foreach ($blockedImport in $blockedImports) {
              if ($imports -match "Symbol:\s+$([regex]::Escape($blockedImport))\b") {
                if ($isRuntimeDll) {
                  Write-Warning "$binaryPath imports $blockedImport as part of the VC++/UCRT runtime set."
                } else {
                  Write-Host "::error::$binaryPath imports $blockedImport, which is not available on Windows 7."
                  $failed = $true
                }
              }
            }
          }

          $flutterWindowsPdb = ".\out\host_release\flutter_windows.dll.pdb"
          if (Test-Path -LiteralPath $flutterWindowsPdb) {
            $pdbText = Select-String -LiteralPath $flutterWindowsPdb -Pattern "win7_atomic_wait_shim.obj" -SimpleMatch
            if ($pdbText) {
              Write-Host "Confirmed flutter_windows.dll.pdb contains win7_atomic_wait_shim.obj."
            } else {
              Write-Host "::error::flutter_windows.dll.pdb does not contain win7_atomic_wait_shim.obj."
              $failed = $true
            }
          } else {
            Write-Warning "flutter_windows.dll.pdb was not found; skipped shim object evidence check."
          }

          if ($failed) {
            throw "Windows 7 incompatible imports were found."
          }

      - name: Package build outputs
        working-directory: engine/src
        run: |
          $outputPath = "${{ github.workspace }}\windows-x64-release.zip"
          $archive = ".\out\host_release\zip_archives\windows-x64-release\windows-x64-flutter.zip"
          if (-not (Test-Path -LiteralPath $archive)) {
            Get-ChildItem -Path ".\out\host_release\zip_archives" -Recurse -Filter "*.zip" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "Found archive: $($_.FullName)" }
            throw "Build archive not found: $archive"
          }
          Copy-Item -LiteralPath $archive -Destination $outputPath -Force

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: windows-x64-release.zip
          tag: ${{ github.ref_name }}
          overwrite: true
          body: Flutter Engine Release
